name: Rust CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build-with-samply:
    uses: samply/github-workflows/.github/workflows/rust.yml@main
    with:
      image-prefix: "samply/"
      components: '[ "putyourcratenamehere" ]'
      test-via-script: false # false: tests via cargo test. true: Test via ./dev/test ci [featurename]
      #push-to: auto
      #architectures: '[ "amd64", "arm64" ]'
      #features: '[ "" ]'
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
